{% load ui %}
{% for hidden in form.hidden_fields %}{% for error in hidden.errors %}<div class="alert alert-danger" role="alert">{% icon "x-circle-fill" %}<div class="alert-body">{{ error }}</div></div>{% endfor %}{% endfor %}
{% if form.non_field_errors %}
    <div class="alert alert-danger" role="alert">
        {% icon "x-circle-fill" %}
        <div class="alert-body">{% for error in form.non_field_errors %}<div>{{ error }}</div>{% endfor %}</div>
    </div>
{% endif %}
